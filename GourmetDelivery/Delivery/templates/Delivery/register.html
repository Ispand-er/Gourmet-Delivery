{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <title>Регистрация аккаунта</title>
</head>
<body class="form-page">
    <div class="form-wrapper">
        <h1>Регистрация аккаунта</h1>
        <form id="register-form" action="{% url 'catalog' %}" method="GET">
            <div class="form-group">
                <label for="reg-fullname">ФИО</label>
                <input type="text" id="reg-fullname" class="form-control">
                <span class="error-message" id="error-fullname"></span>
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="text" id="reg-email" class="form-control">
                <span class="error-message" id="error-email"></span>
            </div>
            <div class="form-group">
                <label for="reg-login">Логин</label>
                <input type="text" id="reg-login" class="form-control">
                <span class="error-message" id="error-login"></span>
            </div>
            <div class="form-group">
                <label for="reg-password">Пароль</label>
                <div class="input-password-wrapper">
                    <input type="password" id="reg-password" class="form-control">
                    <button type="button" class="btn-toggle-password" data-target="reg-password">Показать</button>
                </div>
                <span class="error-message" id="error-password"></span>
            </div>
            <div class="form-group">
                <label for="reg-password-confirm">Повторите пароль</label>
                <div class="input-password-wrapper">
                    <input type="password" id="reg-password-confirm" class="form-control">
                    <button type="button" class="btn-toggle-password" data-target="reg-password-confirm">Показать</button>
                </div>
                <span class="error-message" id="error-password-confirm"></span>
            </div>
            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>
        <div class="form-redirect">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </div>
    </div>
    <script src="{% static 'script.js' %}"></script>
</body>
</html>
